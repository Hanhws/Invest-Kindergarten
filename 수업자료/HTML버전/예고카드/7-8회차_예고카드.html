<title>주식 유치원 · 7·8회차 예고</title>
<style>
  :root {
    --paper: #f7f4ec;
    --card: #ffffff;
    --ink: #232019;
    --ink-soft: #6b6459;
    --line: #e7e0d3;
    --grow: #1f8a5b;
    --grow-soft: #e6f2ea;
    --gold: #c98a2b;
    --gold-soft: #f6ecda;
    --red: #c0392b;
    --red-soft: #f6e3e0;
    --shadow: 24px 32px 60px -32px rgba(40, 34, 22, .35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #16140f; --card: #201d17; --ink: #f2ece0; --ink-soft: #a89f8f;
      --line: #322d24; --grow: #47c98a; --grow-soft: #16281f; --gold: #e0a94a;
      --gold-soft: #2a2114; --red: #e07a6c; --red-soft: #2c1a17;
      --shadow: 24px 32px 60px -30px rgba(0, 0, 0, .6);
    }
  }
  :root[data-theme="light"] {
    --paper: #f7f4ec; --card: #ffffff; --ink: #232019; --ink-soft: #6b6459;
    --line: #e7e0d3; --grow: #1f8a5b; --grow-soft: #e6f2ea; --gold: #c98a2b;
    --gold-soft: #f6ecda; --red: #c0392b; --red-soft: #f6e3e0;
    --shadow: 24px 32px 60px -32px rgba(40, 34, 22, .35);
  }
  :root[data-theme="dark"] {
    --paper: #16140f; --card: #201d17; --ink: #f2ece0; --ink-soft: #a89f8f;
    --line: #322d24; --grow: #47c98a; --grow-soft: #16281f; --gold: #e0a94a;
    --gold-soft: #2a2114; --red: #e07a6c; --red-soft: #2c1a17;
    --shadow: 24px 32px 60px -30px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: clamp(16px, 4vw, 56px);
  }

  .card {
    width: 100%;
    max-width: 620px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ── Header ── */
  .head {
    padding: clamp(28px, 5vw, 40px) clamp(24px, 5vw, 44px) clamp(24px, 4vw, 32px);
    border-bottom: 1px solid var(--line);
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .14em;
    color: var(--grow);
    text-transform: uppercase;
    margin: 0 0 14px;
  }
  .eyebrow::before {
    content: "";
    width: 26px; height: 2px;
    background: var(--grow);
  }
  h1 {
    margin: 0;
    font-size: clamp(26px, 6vw, 36px);
    font-weight: 800;
    letter-spacing: -.02em;
    text-wrap: balance;
  }
  .goal {
    margin: 16px 0 0;
    padding: 14px 18px;
    background: var(--grow-soft);
    border-radius: 12px;
    font-size: clamp(14px, 3.2vw, 16px);
    font-weight: 600;
    color: var(--ink);
  }
  .goal b { color: var(--grow); }

  /* ── Body ── */
  .body {
    padding: clamp(22px, 4vw, 36px) clamp(24px, 5vw, 44px) clamp(28px, 5vw, 40px);
    display: flex;
    flex-direction: column;
    gap: 30px;
  }
  .session-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .06em;
    color: var(--gold);
    margin: 0 0 16px;
  }
  .session-tag .chip {
    background: var(--gold-soft);
    color: var(--gold);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    letter-spacing: .1em;
  }
  section.session:nth-of-type(2) .session-tag { color: var(--grow); }
  section.session:nth-of-type(2) .session-tag .chip { background: var(--grow-soft); color: var(--grow); }

  /* Agenda list */
  .agenda {
    list-style: none;
    margin: 0; padding: 0;
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .topic {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
  }
  .topic:last-child { border-bottom: none; }
  .topic .num {
    flex: none;
    width: 34px; height: 34px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 800;
    background: var(--grow-soft);
    color: var(--grow);
    font-variant-numeric: tabular-nums;
  }
  section.session:nth-of-type(1) .topic .num { background: var(--gold-soft); color: var(--gold); }
  .topic .t-body { flex: 1; }
  .topic h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
  }
  .topic p {
    margin: 3px 0 0;
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  /* 준비해오기 */
  .prep {
    margin-top: 12px;
    border: 1.5px dashed var(--gold);
    background: var(--gold-soft);
    border-radius: 12px;
    padding: 14px 18px;
  }
  section.session:nth-of-type(2) .prep { border-color: var(--grow); background: var(--grow-soft); }
  .prep .prep-label {
    margin: 0 0 6px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .06em;
    color: var(--gold);
  }
  section.session:nth-of-type(2) .prep .prep-label { color: var(--grow); }
  .prep ul { margin: 0; padding-left: 18px; }
  .prep li { font-size: 13.5px; color: var(--ink); padding: 2px 0; }
  .prep .note {
    margin: 8px 0 0;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  /* Takeaway */
  .takeaway {
    background: var(--ink);
    color: var(--paper);
    border-radius: 14px;
    padding: 22px 24px;
    text-align: center;
  }
  .takeaway .section-label {
    font-size: 12px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase;
    color: rgba(255,255,255,.55); margin: 0 0 8px;
  }
  .takeaway p {
    margin: 0;
    font-size: clamp(15px, 3.6vw, 18px);
    font-weight: 700;
    line-height: 1.5;
    text-wrap: balance;
  }
  .takeaway .hl { color: var(--grow); }

  @media print {
    body { padding: 0; background: var(--card); }
    .card { border: none; box-shadow: none; max-width: none; }
    .body > section { break-inside: avoid; }
  }

  /* ── Punchy teaser ── */
  .teaser { display: flex; flex-direction: column; gap: 14px; }
  .teaser .session-tag { margin: 0; }
  .teaser h2 {
    margin: 0;
    font-size: clamp(28px, 7vw, 40px);
    font-weight: 900;
    letter-spacing: -.03em;
    line-height: 1.2;
    text-wrap: balance;
  }
  .teaser .hook {
    margin: 0;
    font-size: clamp(17px, 4.2vw, 21px);
    font-weight: 800;
    line-height: 1.45;
    padding: 16px 20px;
    border-radius: 12px;
    background: var(--red-soft);
    color: var(--red);
  }
  .divider { height: 1px; background: var(--line); }
</style>

<div class="card">
  <header class="head">
    <p class="eyebrow">주식 유치원 · 다음 시간 예고</p>
    <h1>7·8회차 예고</h1>
  </header>

  <div class="body">

    <section class="teaser">
      <p class="session-tag"><span class="chip">7회차</span></p>
      <h2>금리, 어디다 써?</h2>
      <p class="hook">🔥 지금 당신의 돈은<br>빛의 속도로 녹고 있다.</p>
    </section>

    <div class="divider"></div>

    <section class="teaser">
      <p class="session-tag" style="color:var(--grow)"><span class="chip" style="background:var(--grow-soft);color:var(--grow)">8회차</span></p>
      <h2>일본, 잃어버린 30년</h2>
      <p class="hook">🇯🇵 30년 동안 멈춘 나라.<br>우리도?</p>
    </section>

  </div>
</div>
